<html lang="en">
<head>
  <meta charset="utf-8" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,400..800&family=Big+Shoulders+Display:wght@800;900&display=swap" rel="stylesheet" />
  <style>
    /* token subset copied from src/style.css (:root) — keep in sync */
    :root {
      --ink: #0b0e13; --ink-2: #151a22; --ink-3: #222a35;
      --plate: rgba(11, 14, 19, 0.84); --plate-hi: rgba(11, 14, 19, 0.93);
      --hair: rgba(255, 255, 255, 0.13); --hair-2: rgba(255, 255, 255, 0.3);
      --fg: #fff; --fg-2: rgba(255, 255, 255, 0.72); --fg-3: rgba(255, 255, 255, 0.48);
      --accent: #ff5a1f; --accent-hi: #ff7a45; --on-accent: #0b0e13;
      --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
      --ui: "Archivo", "Helvetica Neue", Arial, sans-serif;
      --track-caps: 0.14em; --cut: 10px; --cut-s: 7px; --snap: cubic-bezier(0.2, 0.85, 0.25, 1);
      --edge-t: max(18px, env(safe-area-inset-top)); --edge-r: max(18px, env(safe-area-inset-right));
      --edge-b: max(18px, env(safe-area-inset-bottom)); --edge-l: max(18px, env(safe-area-inset-left));
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: var(--fg); font-family: var(--ui); -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
    .cut { clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, var(--cut) 100%, 0 calc(100% - var(--cut))); }
    .top { position: fixed; top: var(--edge-t); left: var(--edge-l); display: flex; flex-direction: column; align-items: flex-start; pointer-events: none; }
    .kick { margin-bottom: 8px; padding: 5px 9px 4px; font: 700 10px/1.3 var(--ui); letter-spacing: 0.12em; background: var(--plate); max-width: calc(100vw - var(--edge-l) - var(--edge-r) - 76px); text-wrap: balance; }
    .wm { margin: 0; padding: 0.1em 0.2em 0.02em 0.17em; font: 900 clamp(48px, min(9vw, 13vh), 96px) / 0.86 var(--display); letter-spacing: 0.01em; background: var(--plate-hi); clip-path: polygon(0 0, calc(100% - 0.22em) 0, 100% 0.22em, 100% 100%, 0 100%); }
    .sub { margin-left: 0.6em; padding: 6px 30px 5px 10px; font: 800 12px/1 var(--ui); letter-spacing: 0.26em; color: var(--on-accent); background: var(--accent); clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 100%, 0 100%); }
    .hint { position: fixed; left: 50%; bottom: calc(var(--edge-b) + 62px); transform: translateX(-50%); padding: 6px 10px; font: 600 11px/1.2 var(--ui); letter-spacing: 0.04em; white-space: nowrap; color: var(--fg-2); background: var(--plate); pointer-events: none; transition: opacity 1s; }
    .bar { position: fixed; left: var(--edge-l); right: var(--edge-r); bottom: var(--edge-b); display: flex; justify-content: center; gap: 6px; }
    .bar button, .bar a { position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 14px; border: 0; font: 800 11px/1 var(--ui); letter-spacing: var(--track-caps); white-space: nowrap; color: var(--fg-2); text-decoration: none; background: var(--plate); cursor: pointer; clip-path: polygon(0 0, calc(100% - var(--cut-s)) 0, 100% var(--cut-s), 100% 100%, var(--cut-s) 100%, 0 calc(100% - var(--cut-s))); transition: color 0.12s, background 0.12s, transform 0.12s; }
    .bar button::before { content: ""; flex: none; width: 8px; height: 8px; box-shadow: inset 0 0 0 1.5px var(--fg-3); transition: background 0.12s, box-shadow 0.12s; }
    .bar button.on { color: var(--fg); }
    .bar button.on::before { background: var(--accent); box-shadow: none; }
    .bar button:hover { background: var(--ink-3); }
    .bar button:active, .bar a:active { transform: scale(0.97); }
    .bar a.play { margin-left: 6px; padding: 0 20px 0 18px; font-size: 13px; letter-spacing: 0.2em; color: var(--on-accent); background: var(--accent); }
    .bar a.play::before { content: ""; border-style: solid; border-width: 6px 0 6px 10px; border-color: transparent transparent transparent var(--on-accent); }
    .bar a.play:hover { background: var(--accent-hi); }
    button:focus { outline: none; }
    button:focus-visible, a:focus-visible { box-shadow: inset 0 0 0 2px var(--fg), inset 0 0 0 4px var(--ink); }
    .dev { position: fixed; top: var(--edge-t); right: var(--edge-r); }
    .dev img { display: block; width: 60px; filter: drop-shadow(0 4px 10px rgba(11, 14, 19, 0.45)); }
    @media (max-width: 760px) {
      .bar { display: grid; grid-template-columns: repeat(3, 1fr); }
      .bar button, .bar a { gap: 6px; padding: 0 8px; font-size: 10px; letter-spacing: 0.06em; }
      .bar a.play { margin-left: 0; font-size: 12px; letter-spacing: 0.16em; }
      .hint { bottom: calc(var(--edge-b) + 104px); }
    }
    @media (max-width: 760px) and (orientation: landscape) {
      .bar { display: flex; flex-wrap: nowrap; }
      .bar button, .bar a { padding: 0 10px; font-size: 10px; letter-spacing: 0.1em; }
      .hint { display: none; }
    }
    @media (max-height: 480px) { .wm { font-size: 46px; } .kick { font-size: 9px; } }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="top">
    <div class="kick">FAN-MADE 3D MODEL · NOT AFFILIATED WITH TESLA</div>
    <h1 class="wm">ROADSTER</h1>
    <div class="sub">3D MODEL</div>
  </div>
  <div class="hint" id="hint">Drag to orbit · scroll or pinch to zoom · right-drag to pan</div>
  <div class="bar">
    <button id="b-rot" class="on">AUTO-ROTATE</button>
    <button id="b-lights" class="on">LIGHTS</button>
    <button id="b-wing">WING</button>
    <button id="b-env">NIGHT</button>
    <button id="b-thrust">THRUSTERS</button>
    <a class="play" href="./">PLAY</a>
  </div>
  <a class="dev" href="https://x.com/0xCodila" target="_blank" rel="noopener" title="@0xCodila on X"><img src="/0xcodila-badge.png" alt="@0xCodila" width="64" /></a>
  <script type="module" src="/src/viewer.js"></script>
</body>
</html>
